name: CI TEST BATTO
on:
  push:
    branches:
      [main]

jobs:
  test_batto:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        
      - name: Set up .NET CORE
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Test
        run: dotnet test Batto.slx -c Release
  