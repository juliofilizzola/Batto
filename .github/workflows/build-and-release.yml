name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Compile the solution. Test and lint only run when this job succeeds.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Batto.slnx -c Release

  # 2. Unit tests. Depends on build.
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Batto.slnx -c Release

  # 3. Lint: compiler analyzers with warnings treated as errors. Depends on build.
  lint:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Lint (warnings as errors)
        run: dotnet build Batto.slnx -c Release -warnaserror -p:EnforceCodeStyleInBuild=true

  # 4. Release artifacts. Runs only for version tags, after build, test and lint all pass.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        run: >
          dotnet publish src/Batto/Batto.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          $script = Get-Content distribution/Batto.iss -Raw
          $script = $script -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          Set-Content distribution/Batto.build.iss $script
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" distribution\Batto.build.iss

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/Batto_Setup_*.exe
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
