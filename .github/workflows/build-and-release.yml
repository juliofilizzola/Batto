name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']


permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Batto.slnx -c Release

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Batto.slnx -c Release

  lint:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Lint (warnings as errors)
        run: dotnet build Batto.slnx -c Release -warnaserror -p:EnforceCodeStyleInBuild=true

  linux-package:
    runs-on: ubuntu-latest
    needs: [build, test, lint]
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and runtime dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git dotnet-sdk-10.0 bluez icu fontconfig libxkbcommon wayland libx11

      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/linux' && makepkg -f --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: batto-linux-pkg
          path: packaging/linux/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint, linux-package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        run: >
          dotnet publish src/Batto/Batto.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          $script = Get-Content distribution/Batto.iss -Raw
          $script = $script -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          Set-Content distribution/Batto.build.iss $script
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" distribution\Batto.build.iss

      - uses: actions/download-artifact@v4
        with:
          name: batto-linux-pkg
          path: linux-pkg

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/Batto_Setup_*.exe
            linux-pkg/*.pkg.tar.zst
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
