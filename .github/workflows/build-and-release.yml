name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Batto.slnx -c Release

      - name: Test
        run: dotnet test Batto.slnx -c Release --no-build

      - name: Publish self-contained executable
        run: >
          dotnet publish src/Batto/Batto.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Batto-exe
          path: publish/Batto.exe

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          $script = Get-Content distribution/Batto.iss -Raw
          $script = $script -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          Set-Content distribution/Batto.build.iss $script
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" distribution\Batto.build.iss

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/Batto_Setup_*.exe
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
